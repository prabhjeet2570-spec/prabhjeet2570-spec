<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Prabhjeet Singh</title>
  <desc id="desc">Software engineering, AI systems, and applied ML. A midnight blue banner with a cyan and violet systems diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1221"/><stop offset="1" stop-color="#171c37"/></linearGradient>
