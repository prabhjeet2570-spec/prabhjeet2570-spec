  <text x="57" y="183" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Prabhjeet Singh</text>
  <text x="60" y="229" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="23">Building useful systems. Making the details matter.</text>
  <text x="60" y="284" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1">CODE  /  MODELS  /  DATA  /  PRODUCTS</text>
  <g fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M865 119 L953 82 L1052 135 L1110 212 L998 261 L896 213 Z" opacity=".45"/>
    <path d="M865 119 L998 261 M953 82 L896 213 M1052 135 L896 213 M1052 135 L998 261 M865 119 L1052 135" opacity=".25"/>
  </g>
